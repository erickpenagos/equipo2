<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola, soy Fernando</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #faf9f6;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #f1f5f9;
            text-align: center;
        }

        .avatar {
            width: 64px;
            height: 64px;
            background-color: #e0f2fe;
            color: #0284c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 14px;
            text-align: left;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }

        .tag {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 8px 14px;
            border-radius: 9999px;
            font-size: 0.9rem;
            color: #334155;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tag:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
            border-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar">✨</div>
        <h1>Fernando Rodríguez</h1>
        <p class="tagline">Bienvenido a mi espacio personal.</p>

        <p class="section-title">Lo que me apasiona</p>
        <div class="tags-container">
            <span class="tag">💻 Programar</span>
            <span class="tag">🎨 Pintura al óleo</span>
            <span class="tag">🎸 Tocar la guitarra</span>
            <span class="tag">🚀 Cine de ciencia ficción</span>
            <span class="tag">🌮 Tacos al pastor</span>
            <span class="tag">🎮 Videojuegos</span>
        </div>
    </div>

</body>
</html>
